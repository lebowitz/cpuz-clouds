<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360"><rect width="900" height="360" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2633"/></marker></defs><polygon points="80.0,60.0 428.8,60.0 428.8,310.0 80.0,310.0" fill="#eef2f7" fill-opacity="1" stroke="#c5ccd6" stroke-width="1.5"/><polygon points="80.0,60.0 284.8,60.0 284.8,264.8 80.0,264.8" fill="#2d6cdf" fill-opacity="0.08" stroke="#2d6cdf" stroke-width="1.5"/><text x="278.8" y="256.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2d6cdf" text-anchor="end" font-weight="bold" style="white-space:pre">pass 0</text><polygon points="104.0,84.0 308.8,84.0 308.8,288.8 104.0,288.8" fill="#e0782a" fill-opacity="0.08" stroke="#e0782a" stroke-width="1.5"/><text x="302.8" y="280.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#e0782a" text-anchor="end" font-weight="bold" style="white-space:pre">pass 120</text><line x1="86" y1="66" x2="102.0" y2="82.0" stroke="#1d2633" stroke-width="1.5" marker-end="url(#ah)"/><text x="80.0" y="36.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1d2633" text-anchor="start" font-weight="bold" style="white-space:pre">Pass p renders pixels (x + p, y + p) of one unbounded cloud field</text><text x="500.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2633" text-anchor="start" font-weight="normal" style="white-space:pre">Row k of pass p → pixels (p + i, p + k), i &lt; 1024</text><text x="500.0" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2633" text-anchor="start" font-weight="normal" style="white-space:pre">After 1024 rows, p increases by 1</text><text x="500.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2633" text-anchor="start" font-weight="normal" style="white-space:pre">Same cloud field, shifted 1 pixel diagonally per pass</text><text x="500.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2633" text-anchor="start" font-weight="normal" style="white-space:pre">No pixel is computed twice with the same input</text><text x="500.0" y="198.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6676" text-anchor="start" font-weight="normal" style="white-space:pre"></text><text x="500.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6676" text-anchor="start" font-weight="normal" style="white-space:pre">aether: ~0.8 passes/s single-thread,</text><text x="500.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6676" text-anchor="start" font-weight="normal" style="white-space:pre">~10 passes/s multi-thread (10 s phases)</text></svg>